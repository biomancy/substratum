[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92.0"
authors = ["Aleksandr Fedorov"]
description = "Composable resource managenement for performance-critical tasks."
readme = "README.md"
documentation = "https://github.com/biomancy/substratum"
homepage = "https://github.com/biomancy/substratum"
repository = "https://github.com/biomancy/substratum"
license = "MIT"
categories = ["science", "algorithms"]

[workspace]
members = [
    "workspace/compress",
    "workspace/multilock",
]
resolver = "3"

[workspace.dependencies]
lock_api = { version = "0.4.14", default-features = false }
flate2 = { version = "1.1.5", features = ["zlib-rs"], default-features = false }
noodles-bgzf = { version = "0.45.0", default-features = false }
bitcode = { version = "0.6.9", features = ["derive"], default-features = false }
